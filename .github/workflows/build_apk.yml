name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fresh Setup and Auto Generate Code Files
        run: |
          # پرانے تمام فولڈرز صاف کرنا
          rm -rf android pubspec.yaml lib
          
          # بالکل نیا پروجیکٹ ڈھانچہ تیار کرنا
          flutter create --project-name my_distro_app --platforms android .
          
          # اینڈروئیڈ مینی فیسٹ میں پرنٹنگ اور بلوٹوتھ کی پرمیشنز ڈالنا
          sed -i '/<application/i \    <uses-permission android:name="android.permission.BLUETOOTH" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\n    <uses-permission android:name="android.permission.PRINT" />' android/app/src/main/AndroidManifest.xml
          
          # ہماری اصل ڈسٹری بیوشن ایپ کا مکمل کوڈ خودکار طریقے سے دوبارہ لکھنا
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';

          void main() => runApp(DistributionApp());

          class DistributionApp extends StatelessWidget {
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                theme: ThemeData(primarySwatch: Colors.teal, scaffoldBackgroundColor: Colors.grey),
                home: DashboardScreen(),
              );
            }
          }

          class DashboardScreen extends StatefulWidget {
            @override
            _DashboardScreenState createState() => _DashboardScreenState();
          }

          class _DashboardScreenState extends State<DashboardScreen> {
            List<Map<String, dynamic>> products = [];
            List<Map<String, dynamic>> customers = [];
            List<Map<String, dynamic>> expenses = [];
            List<Map<String, dynamic>> orders = [];

            double get totalSales => orders.fold(0, (sum, item) => sum + (item['sale_price'] * item['qty']));
            double get totalCostOfGoods => orders.fold(0, (sum, item) => sum + (item['purchase_price'] * item['qty']));
            double get totalExpenses => expenses.fold(0, (sum, item) => sum + item['amount']);

            @override
            Widget build(BuildContext context) {
              double grossProfit = totalSales - totalCostOfGoods;
              double netProfit = grossProfit - totalExpenses;

              return Scaffold(
                appBar: AppBar(title: Text('ڈسٹری بیوشن پرو مینجمنٹ'), centerTitle: true),
                body: SingleChildScrollView(
                  child: Padding(
                    padding: const EdgeInsets.all(16.0),
                    child: Column(
                      children: [
                        Card(
                          elevation: 4,
                          shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                          child: Padding(
                            padding: const EdgeInsets.all(16.0),
                            child: Column(
                              children: [
                                _row('کل سیل (Sales)', 'Rs. $totalSales', Colors.blue),
                                _row('مال کی لاگت (Cost)', 'Rs. $totalCostOfGoods', Colors.orange),
                                Divider(),
                                _row('مجموعی منافع (Gross)', 'Rs. $grossProfit', Colors.teal),
                                _row('کل خرچے (Expenses)', 'Rs. $totalExpenses', Colors.red),
                                Divider(thickness: 2),
                                _row('خالص منافع (Net Profit)', 'Rs. $netProfit', Colors.green, isBold: true),
                              ],
                            ),
                          ),
                        ),
                        SizedBox(height: 20),
                        GridView.count(
                          shrinkWrap: true,
                          physics: NeverScrollableScrollPhysics(),
                          crossAxisCount: 2,
                          crossAxisSpacing: 12,
                          mainAxisSpacing: 12,
                          children: [
                            _btn('نیا آرڈر / انوائس', Icons.receipt_long, Colors.green, _openOrder),
                            _btn('انوینٹری / اسٹاک', Icons.inventory, Colors.blue, _viewInventory),
                            _btn('دکانداروں کا کھاتا', Icons.account_balance_wallet, Colors.amber, _viewCustomers),
                            _btn('خرچہ بک کریں', Icons.money_off, Colors.red, _viewExpenses),
                            _btn('پرانے آرڈرز ہسٹری', Icons.history, Colors.purple, _viewOrdersHistory),
                          ],
                        )
                      ],
                    ),
                  ),
                ),
              );
            }

            void _viewCustomers() {
              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                builder: (context) => StatefulBuilder(
                  builder: (context, setModalState) => Padding(
                    padding: EdgeInsets.only(bottom: MediaQuery.of(context).viewInsets.bottom, left: 16, right: 16, top: 16),
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        Text('دکانداروں کی لسٹ', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                        Container(
                          height: 200,
                          child: customers.isEmpty 
                            ? Center(child: Text('کوئی دکاندار موجود نہیں ہے'))
                            : ListView.builder(
                                itemCount: customers.length,
                                itemBuilder: (context, i) => ListTile(
                                  title: Text(customers[i]['name'], style: TextStyle(fontWeight: FontWeight.bold)),
                                  subtitle: Text('فون: ${customers[i]['phone']} | ادھار: Rs.${customers[i]['udhaar']}'),
                                  trailing: IconButton(icon: Icon(Icons.delete, color: Colors.red), onPressed: () { setState(() { customers.removeAt(i); }); setModalState(() {}); }),
                                ),
                              ),
                        ),
                        Divider(),
                        ElevatedButton.icon(
                          icon: Icon(Icons.person_add),
                          label: Text('نیا دکاندار شامل کریں'),
                          onPressed: () {
                            String name = ''; String phone = ''; double udhaar = 0;
                            showDialog(
                              context: context,
                              builder: (context) => AlertDialog(
                                title: Text('نیا دکاندار'),
                                content: Column(
                                  mainAxisSize: MainAxisSize.min,
                                  children: [
                                    TextField(decoration: InputDecoration(labelText: 'دکان کا نام'), onChanged: (v) => name = v),
                                    TextField(decoration: InputDecoration(labelText: 'فون نمبر'), keyboardType: TextInputType.phone, onChanged: (v) => phone = v),
                                    TextField(decoration: InputDecoration(labelText: 'سابقہ ادھار'), keyboardType: TextInputType.number, onChanged: (v) => udhaar = double.tryParse(v) ?? 0),
                                  ],
                                ),
                                actions: [
                                  ElevatedButton(
                                    child: Text('سیو'),
                                    onPressed: () {
                                      if (name.isNotEmpty) {
                                        setState(() { customers.add({"name": name, "phone": phone, "udhaar": udhaar}); });
                                        setModalState(() {});
                                        Navigator.pop(context);
                                      }
                                    },
                                  )
                                ],
                              ),
                            );
                          },
                        ),
                        SizedBox(height: 15),
                      ],
                    ),
                  ),
                ),
              );
            }

            void _viewInventory() {
              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                builder: (context) => StatefulBuilder(
                  builder: (context, setModalState) => Padding(
                    padding: EdgeInsets.only(bottom: MediaQuery.of(context).viewInsets.bottom, left: 16, right: 16, top: 16),
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        Text('موجودہ اسٹاک رپورٹ', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                        Container(
                          height: 200,
                          child: products.isEmpty 
                            ? Center(child: Text('اسٹاک بالکل خالی ہے'))
                            : ListView.builder(
                                itemCount: products.length,
                                itemBuilder: (context, i) => ListTile(
