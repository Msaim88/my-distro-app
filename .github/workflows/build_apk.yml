name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fresh App Structure Setup
        run: |
          # پرانی اینڈروئیڈ کنفیگریشن صاف کرنا تاکہ نیا انجن چلے
          rm -rf android pubspec.yaml
          # فلٹر کو کمانڈ دینا کہ وہ خود نیا اینڈروئیڈ مینی فیسٹ اور v2 embedding بنائے
          flutter create --platforms android .
          # ہمارے کسٹم نام کو pubspec میں سیٹ کرنا
          sed -i 's/name: .*/name: my_distribution_app/' pubspec.yaml

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: distribution-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
