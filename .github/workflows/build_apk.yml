name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Configure and Inject Custom Code
        run: |
          # عارضی طور پر ہمارے اصل سورس کوڈ کا بیک اپ لینا
          mkdir -p backup_lib
          cp lib/main.dart backup_lib/main.dart
          
          # نیا پروجیکٹ اسٹرکچر بنانا
          rm -rf android pubspec.yaml lib
          flutter create --project-name my_distro_app --platforms android .
          
          # اپنے اصل کوڈ کو دوبارہ سسٹم کے اندر انجیکٹ (فٹ) کرنا
          rm -rf lib
          mkdir -p lib
          cp backup_lib/main.dart lib/main.dart
          
          # اینڈروئیڈ مینی فیسٹ میں پرنٹر پرمیشنز خودکار فٹ کرنا
          sed -i '/<application/i \    <uses-permission android:name="android.permission.BLUETOOTH" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\n    <uses-permission android:name="android.permission.PRINT" />' android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: distribution-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
